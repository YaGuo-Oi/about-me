<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Lookbook — ya-guo</title>
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
  </head>
  <body>
    <header class="page-header">
      <div class="header-row">
        <p class="page-tag">Open API Project / Fashion Grid</p>
        <nav class="site-nav">
          <a href="index.html">01. About</a>
          <a href="archive.html" class="active">02. Fashion Archive (API)</a>
        </nav>
      </div>
    </header>

    <main class="about-me-container">
      <section class="section-editorial">
        <div class="section-num">02 / Lookbook</div>
        <h2>Fashion Collection Grid</h2>
        <p>Displaying live product data from the DummyJSON Open API:</p>

        <!-- Category buttons: click to switch between clothing categories -->
        <div class="archive-controls">
          <button class="filter-btn" onclick="loadFashion('womens-dresses')">Dresses</button>
          <button class="filter-btn" onclick="loadFashion('womens-bags')">Bags</button>
          <button class="filter-btn" onclick="loadFashion('womens-shoes')">Shoes</button>
          <button class="filter-btn" onclick="loadFashion('sunglasses')">Sunglasses</button>
        </div>

        <!-- Empty container: cards will be added here once API data loads -->
        <div class="art-grid" id="fashionGrid"></div>
      </section>
    </main>

    <footer class="page-footer">
      <p>Built with DummyJSON Open API · Hosted on GitHub Pages</p>
    </footer>

    <script>
      // 1. Define a function to fetch clothing items by category from the API
      function loadFashion(category) {
        const grid = document.getElementById('fashionGrid');
        grid.innerHTML = '<p>Loading...</p>';

        // 2. Send a request to the DummyJSON Open API
        fetch('https://dummyjson.com/products/category/' + category)
          .then(response => response.json()) // Convert the response into JSON format
          .then(data => {
            grid.innerHTML = ''; // Clear the "Loading..." message

            // 3. Loop through each item and create a card in the grid
            data.products.forEach(item => {
              grid.innerHTML += `
                <div class="art-card">
                  <img class="art-thumb" src="${item.thumbnail}" alt="${item.title}">
                  <div class="art-meta">$${item.price}</div>
                  <h3 class="art-title">${item.title}</h3>
                  <p class="art-artist">${item.brand || 'Fashion Collection'}</p>
                </div>
              `;
            });
          });
      }

      // Load women's dresses by default when the page first opens
      loadFashion('womens-dresses');
    </script>
  </body>
</html>
